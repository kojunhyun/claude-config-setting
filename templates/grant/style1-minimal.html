<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{PROJECT_TITLE}} - Minimal Pipeline</title>
<style>
  :root {
    --line: #cbd5e1;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #1e293b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #ffffff;
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .slide {
    width: 1920px; height: 1080px;
    padding: 80px 120px;
    margin: 0 auto;
    position: relative;
  }
  .title {
    font-size: 56px; font-weight: 300; letter-spacing: -0.02em;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 22px; color: var(--muted); font-weight: 400;
    margin-bottom: 80px;
  }
  .pipeline {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px;
    margin-top: 60px;
  }
  .stage {
    flex: 1;
    border-top: 1px solid var(--line);
    padding-top: 32px;
    position: relative;
  }
  .stage::before {
    content: ''; position: absolute; top: -5px; left: 0;
    width: 9px; height: 9px; background: var(--accent);
    border-radius: 50%;
  }
  .stage-num {
    font-size: 14px; color: var(--muted); letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .stage-name {
    font-size: 32px; font-weight: 500; margin: 0 0 20px 0;
    letter-spacing: -0.01em;
  }
  .stage-desc {
    font-size: 17px; line-height: 1.6; color: var(--muted);
    font-weight: 400;
  }
  .footer {
    position: absolute; bottom: 60px; left: 120px; right: 120px;
    display: flex; justify-content: space-between;
    font-size: 14px; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 20px;
  }
</style>
</head>
<body>
<div class="slide">
  <h1 class="title">{{PROJECT_TITLE}}</h1>
  <div class="subtitle">{{PROJECT_SUBTITLE}}</div>

  <div class="pipeline">
    <!-- stage 카드 5개. 내용은 프로젝트에 맞게 치환 -->
    <div class="stage">
      <div class="stage-num">01 / Input</div>
      <div class="stage-name">{{STAGE1_NAME}}</div>
      <div class="stage-desc">{{STAGE1_DESC}}</div>
    </div>
    <div class="stage">
      <div class="stage-num">02 / Process</div>
      <div class="stage-name">{{STAGE2_NAME}}</div>
      <div class="stage-desc">{{STAGE2_DESC}}</div>
    </div>
    <div class="stage">
      <div class="stage-num">03 / AI Core</div>
      <div class="stage-name">{{STAGE3_NAME}}</div>
      <div class="stage-desc">{{STAGE3_DESC}}</div>
    </div>
    <div class="stage">
      <div class="stage-num">04 / Validate</div>
      <div class="stage-name">{{STAGE4_NAME}}</div>
      <div class="stage-desc">{{STAGE4_DESC}}</div>
    </div>
    <div class="stage">
      <div class="stage-num">05 / Deliver</div>
      <div class="stage-name">{{STAGE5_NAME}}</div>
      <div class="stage-desc">{{STAGE5_DESC}}</div>
    </div>
  </div>

  <div class="footer">
    <div>{{ORGANIZATION}}</div>
    <div>{{DATE}}</div>
  </div>
</div>
</body>
</html>
