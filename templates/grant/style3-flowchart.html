<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>{{PROJECT_TITLE}} - Flowchart Pipeline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #ffffff;
    font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
  }
  .slide { width: 1920px; height: 1080px; margin: 0 auto; }
</style>
</head>
<body>
<div class="slide">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1e293b"/>
    </marker>
    <linearGradient id="grad-input" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="grad-process" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="grad-ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="grad-check" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="grad-out" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- Title -->
  <text x="120" y="120" font-size="52" font-weight="700" fill="#0f172a">{{PROJECT_TITLE}}</text>
  <text x="120" y="170" font-size="22" font-weight="500" fill="#64748b">{{PROJECT_SUBTITLE}}</text>

  <!-- Decorative bar -->
  <rect x="120" y="195" width="80" height="4" fill="#0f172a"/>

  <!-- Stage 1: Input (rounded rect) -->
  <g>
    <rect x="120" y="350" width="280" height="180" rx="20" ry="20" fill="url(#grad-input)" stroke="#3b82f6" stroke-width="2"/>
    <text x="260" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af" letter-spacing="0.1em">STAGE 01</text>
    <text x="260" y="445" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">{{STAGE1_NAME}}</text>
    <foreignObject x="150" y="465" width="220" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Pretendard',sans-serif;font-size:14px;color:#475569;line-height:1.45;text-align:center;">{{STAGE1_DESC}}</div>
    </foreignObject>
  </g>

  <!-- Arrow 1 -->
  <line x1="405" y1="440" x2="475" y2="440" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2: Process -->
  <g>
    <rect x="480" y="350" width="280" height="180" rx="20" ry="20" fill="url(#grad-process)" stroke="#f59e0b" stroke-width="2"/>
    <text x="620" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e" letter-spacing="0.1em">STAGE 02</text>
    <text x="620" y="445" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">{{STAGE2_NAME}}</text>
    <foreignObject x="510" y="465" width="220" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Pretendard',sans-serif;font-size:14px;color:#475569;line-height:1.45;text-align:center;">{{STAGE2_DESC}}</div>
    </foreignObject>
  </g>

  <!-- Arrow 2 -->
  <line x1="765" y1="440" x2="835" y2="440" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 3: AI Core (큰 강조 박스) -->
  <g>
    <rect x="840" y="320" width="320" height="240" rx="24" ry="24" fill="url(#grad-ai)" stroke="#7c3aed" stroke-width="3"/>
    <text x="1000" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" letter-spacing="0.1em">★ AI CORE</text>
    <text x="1000" y="425" text-anchor="middle" font-size="32" font-weight="800" fill="#0f172a">{{STAGE3_NAME}}</text>
    <foreignObject x="870" y="445" width="260" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Pretendard',sans-serif;font-size:14px;color:#475569;line-height:1.5;text-align:center;">{{STAGE3_DESC}}</div>
    </foreignObject>
  </g>

  <!-- Arrow 3 -->
  <line x1="1165" y1="440" x2="1235" y2="440" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 4: Validation -->
  <g>
    <rect x="1240" y="350" width="280" height="180" rx="20" ry="20" fill="url(#grad-check)" stroke="#ec4899" stroke-width="2"/>
    <text x="1380" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d" letter-spacing="0.1em">STAGE 04</text>
    <text x="1380" y="445" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">{{STAGE4_NAME}}</text>
    <foreignObject x="1270" y="465" width="220" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Pretendard',sans-serif;font-size:14px;color:#475569;line-height:1.45;text-align:center;">{{STAGE4_DESC}}</div>
    </foreignObject>
  </g>

  <!-- Arrow 4 -->
  <line x1="1525" y1="440" x2="1595" y2="440" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 5: Output -->
  <g>
    <rect x="1600" y="350" width="200" height="180" rx="20" ry="20" fill="url(#grad-out)" stroke="#10b981" stroke-width="2"/>
    <text x="1700" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46" letter-spacing="0.1em">STAGE 05</text>
    <text x="1700" y="445" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">{{STAGE5_NAME}}</text>
    <foreignObject x="1620" y="465" width="160" height="60">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Pretendard',sans-serif;font-size:13px;color:#475569;line-height:1.45;text-align:center;">{{STAGE5_DESC}}</div>
    </foreignObject>
  </g>

  <!-- Feedback loop (점선 아래 화살표 — AI Core에서 Process로 되돌림) -->
  <path d="M 1000 580 Q 1000 700 620 700 Q 620 700 620 540" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="810" y="730" text-anchor="middle" font-size="14" fill="#64748b" font-style="italic">피드백 루프 (반복 학습)</text>

  <!-- Footer -->
  <line x1="120" y1="980" x2="1800" y2="980" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="1015" font-size="14" font-weight="600" fill="#0f172a">{{ORGANIZATION}}</text>
  <text x="1800" y="1015" text-anchor="end" font-size="14" fill="#64748b">{{DATE}}</text>
</svg>
</div>
</body>
</html>
